services:
  frontend:
    image: riacs-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules: